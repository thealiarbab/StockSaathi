# Front-door Worker — intercepts all stocksaathi.co.in traffic, steers between
# Vercel (primary) and Fly.io / CF Pages (backup).
#
# Deploy:   wrangler deploy  (from app/edge/front-door/)
# Secrets:  wrangler secret put <NAME>
#
# Bindings needed at deploy time:
#   - KV: HEALTH_KV (for the 30 s circuit-breaker)
#   - vars: all the LLM keys that chat.js + ai.js read via globalThis.process.env
#           (OPENAI_API_KEY, GEMINI_API_KEY, CEREBRAS_API_KEY, GROQ_API_KEY,
#            SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY,
#            optionally OPENAI_MODEL, GEMINI_FAST_MODEL, GEMINI_PRO_MODEL,
#            PUBLIC_ORIGIN, TEST_IP_ALLOWLIST)

name = "stocksaathi-front-door"
main = "src/index.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Bind Vercel's own compatible behavior for fetch
# (no workers_dev deployment — this worker ships straight to the prod route)
workers_dev = false

# Bind to the apex and www hostnames. Both must be orange-clouded in CF DNS.
routes = [
  { pattern = "stocksaathi.co.in/*", zone_name = "stocksaathi.co.in" },
  { pattern = "www.stocksaathi.co.in/*", zone_name = "stocksaathi.co.in" },
]

# HEALTH_KV namespace ID — user must replace after `wrangler kv:namespace create HEALTH_KV`.
[[kv_namespaces]]
binding = "HEALTH_KV"
id = "REPLACE_WITH_KV_ID_AFTER_wrangler_kv_namespace_create"

# Cron trigger — server-side order matcher.
#
# Every minute, all day. /api/match-orders checks IST market hours itself and
# returns immediately when the NSE is shut, so the off-hours ticks cost
# essentially nothing. Running the schedule flat rather than restricting it to
# market hours in cron syntax means no DST/holiday logic lives in two places.
#
# Needs CRON_SECRET bound:  wrangler secret put CRON_SECRET
# (must match the CRON_SECRET env var in the Vercel project)
[triggers]
crons = ["* * * * *"]

# Observability — cheap and invaluable during a real outage.
[observability]
enabled = true
