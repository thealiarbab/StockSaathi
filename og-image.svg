<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0B0F"/>
      <stop offset="55%" stop-color="#0B1812"/>
      <stop offset="100%" stop-color="#0F1F18"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#22C55E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .wm   { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; letter-spacing: -1.5px; }
      .head { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; letter-spacing: -0.5px; }
      .sub  { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 500; }
      .pill { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; letter-spacing: 0.2px; }
      .url  { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g opacity="0.08" stroke="#4ADE80" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
  </g>

  <!-- Decorative trend line (illustration, not data). -->
  <path d="M 640 470 L 700 455 L 760 468 L 820 430 L 880 440 L 940 395 L 1000 404 L 1060 350 L 1120 318 L 1200 270 L 1200 630 L 640 630 Z" fill="url(#fill)"/>
  <path d="M 640 470 L 700 455 L 760 468 L 820 430 L 880 440 L 940 395 L 1000 404 L 1060 350 L 1120 318 L 1200 270" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(72,96)">
    <rect x="0" y="0" width="14" height="56" rx="3" fill="#22C55E"/>
    <text x="34" y="48" class="wm" font-size="76" fill="#ffffff">StockSaathi</text>
  </g>

  <text x="86" y="232" class="head" font-size="50" fill="#ffffff">Invest virtually.</text>
  <text x="86" y="292" class="head" font-size="50" fill="#22C55E">Learn for real.</text>

  <text x="86" y="350" class="sub" font-size="28" fill="#CBD5E1">Free stock market simulator for Indian teens, 13–18</text>

  <g transform="translate(86,396)" class="pill" font-size="22">
    <rect x="0" y="0" width="300" height="54" rx="27" fill="#0F1F18" stroke="#22C55E" stroke-width="1.5"/>
    <text x="24" y="35" fill="#E5E7EB"><tspan fill="#22C55E" font-weight="800">₹1,00,000</tspan> virtual money</text>

    <rect x="316" y="0" width="236" height="54" rx="27" fill="#0F1F18" stroke="#22C55E" stroke-width="1.5"/>
    <text x="340" y="35" fill="#E5E7EB">NSE + BSE stocks</text>

    <rect x="0" y="70" width="300" height="54" rx="27" fill="#0F1F18" stroke="#22C55E" stroke-width="1.5"/>
    <text x="24" y="105" fill="#E5E7EB">AI coach for beginners</text>

    <rect x="316" y="70" width="236" height="54" rx="27" fill="#0F1F18" stroke="#22C55E" stroke-width="1.5"/>
    <text x="340" y="105" fill="#E5E7EB">Crash replays</text>
  </g>

  <g transform="translate(1130,592)" text-anchor="end">
    <text x="0" y="0" class="url" font-size="22" fill="#94A3B8">stocksaathi.co.in</text>
  </g>

  <rect x="0" y="624" width="1200" height="6" fill="#22C55E"/>
</svg>
