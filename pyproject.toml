[project]
name = "stocksaathi"
version = "0.1.0"
description = "StockSaathi — static site with @vercel/python serverless functions (stdlib-only handlers)"
requires-python = ">=3.12"
# The handlers themselves are still stdlib-only. These two are for the single
# ASGI entrypoint (api/index.py -> handlers/_shim.py) that dispatches to them,
# which exists because Vercel's Hobby plan caps a deployment at 12 serverless
# functions and one-file-per-handler put us at 21.
#
# These MUST live here, not in requirements.txt. Vercel's build log shows
# "Installing required dependencies from uv.lock" — the uv path wins and
# requirements.txt is never read. Declaring them only there produced a clean
# build and a FUNCTION_INVOCATION_FAILED on every request, because
# `from fastapi import FastAPI` raised ImportError at cold start.
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Vercel's framework=python build path runs `uv sync --frozen` which tries to
# install our repo root as a Python package. Without this block setuptools'
# auto-discovery sees js/, api/, css/, edge/, supabase/ as candidate packages
# and refuses to build (multi-top-level layout). We have NO actual Python
# package to ship — the api/*.py handlers are bundled by @vercel/python's
# per-function builder, not packaged. Tell setuptools that explicitly:
[tool.setuptools]
# Empty package list — `uv sync` builds an empty wheel and moves on instead
# of trying to import our front-end JS as Python modules.
packages = []
# py_modules likewise empty so setuptools doesn't pick up loose .py files
# at the repo root (none exist today, but defensive against future drift).
py-modules = []
