name: backup-deploy

# Deploys the failover stack on every push to main. Vercel deploys the
# primary via its own GitHub integration; this workflow only handles the
# backup tiers (Fly.io + CF Pages + CF Worker).
#
# Required GitHub secrets:
#   - CLOUDFLARE_API_TOKEN     (scopes: Pages:Edit, Workers:Edit, KV:Edit)
#   - CLOUDFLARE_ACCOUNT_ID
#   - FLY_API_TOKEN            (flyctl auth token)
#
# Required GitHub variables (non-secret):
#   - FLY_APP_NAME             (default "stocksaathi-backup" if unset)
#   - CF_PAGES_PROJECT_NAME    (default "stocksaathi")

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: backup-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reports whether the deploy credentials exist, so the deploy jobs can skip
  # cleanly instead of failing.
  #
  # WHY: this workflow had 366 runs and 0 successes. The first cause was
  # parity-check failing (api-backup/main.py's _ROUTES was missing 4 handlers);
  # that is fixed and parity now passes 16/16. What remains is simply that
  # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and FLY_API_TOKEN have never
  # been set, so wrangler exits with "it's necessary to set a
  # CLOUDFLARE_API_TOKEN environment variable" and flyctl with "no access
  # token available".
  #
  # A permanently-red required-looking workflow on every push to main trains
  # everyone to ignore it -- and parity-check is not decoration. It is the only
  # CI this repo has: it runs api-backup/tests/ (route parity AND the
  # order-execution regression guards, which exist because orders silently
  # rotted for up to 128 days with users' cash reserved) plus
  # scripts/check-js-syntax.mjs (added after a syntax error blanked the
  # homepage in v273). Those must keep running and must be visibly green.
  #
  # So: gate the deploys on the secrets. With no secrets the run is green with
  # the deploys skipped; add the secrets and they start deploying with no
  # further edit. Note the secrets context is not available in a job-level
  # `if:`, hence reading them into env here.
  preflight:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    outputs:
      has_cf: ${{ steps.check.outputs.has_cf }}
      has_fly: ${{ steps.check.outputs.has_fly }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has_cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cf=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped - set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable."
          fi
          if [ -n "$FLY_TOKEN" ]; then
            echo "has_fly=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_fly=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fly.io deploy skipped - set FLY_API_TOKEN to enable."
          fi

  parity-check:
    name: Handler parity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest fastapi uvicorn
      - name: Verify every app/api/*.py is registered in api-backup/main.py
        working-directory: .
        run: pytest api-backup/tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # A JS module that fails to PARSE takes the whole app down silently:
      # app.js imports the router which imports every page, so one bad
      # literal anywhere means no nav, no router, no anything — and no
      # stack trace pointing at the cause. That shipped on 2026-09-13
      # (v273) and blanked the homepage.
      #
      # `node --check` does not catch it: it parses ES modules as scripts
      # and reported the broken file clean. This compiles each module with
      # vm.SourceTextModule instead — parse only, never evaluate.
      - name: JS syntax check (all ES modules)
        run: node --experimental-vm-modules scripts/check-js-syntax.mjs

  deploy-pages:
    name: Deploy Cloudflare Pages (static backup)
    needs: [parity-check, preflight]
    if: needs.preflight.outputs.has_cf == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Stage Pages publish directory
        run: |
          mkdir -p ./_pages_publish
          rsync -a \
            --exclude='api/' \
            --exclude='handlers/' \
            --exclude='api-backup/' \
            --exclude='edge/' \
            --exclude='.github/' \
            --exclude='.git/' \
            --exclude='supabase/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='node_modules/' \
            --exclude='*.pyc' \
            --exclude='backend.py' \
            --exclude='run.sh' \
            --exclude='run.bat' \
            --exclude='.env*' \
            --exclude='SUPABASE_SETUP.md' \
            --exclude='AGENTS.md' \
            ./ ./_pages_publish/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./_pages_publish --project-name=${{ vars.CF_PAGES_PROJECT_NAME || 'stocksaathi' }} --branch=main

  deploy-fly:
    name: Deploy Fly.io (Python API backup)
    needs: [parity-check, preflight]
    if: needs.preflight.outputs.has_fly == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: flyctl deploy
        run: flyctl deploy --config api-backup/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # NOTE: adding the Cloudflare secrets is not sufficient to make this job
  # pass. edge/front-door/wrangler.toml still carries the literal placeholder
  # id = "REPLACE_WITH_KV_ID_AFTER_wrangler_kv_namespace_create" for the
  # HEALTH_KV binding, so wrangler will reject the deploy until a real KV
  # namespace is created and its id pasted in. This job also binds routes for
  # stocksaathi.co.in/* -- deploying it puts a Worker in front of ALL
  # production traffic, which currently goes straight to Vercel (verified
  # 2026-09-13: the apex responds Server: Vercel with no cf-ray). Treat the
  # first successful run here as a production cutover, not a backup step.
  deploy-worker:
    name: Deploy Cloudflare Worker (front-door)
    needs: [deploy-pages, deploy-fly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install wrangler
        working-directory: edge/front-door
        run: npm ci || npm install
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge/front-door
          command: deploy

  verify:
    name: Health-gate verify (both origins)
    needs: [deploy-pages, deploy-fly, deploy-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Check primary (Vercel)
        run: |
          body=$(curl -fsS --max-time 10 https://stock-saathi-jtmn.vercel.app/api/health)
          echo "primary: $body"
          echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'] is True, d; assert d['runtime']=='vercel', d"
      - name: Check backup (Fly)
        run: |
          app_name="${{ vars.FLY_APP_NAME || 'stocksaathi-backup' }}"
          body=$(curl -fsS --max-time 15 "https://${app_name}.fly.dev/api/health")
          echo "backup: $body"
          echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'] is True, d; assert d['runtime']=='fly', d"
