name: quote-warmer

# Pre-warms public.quote_cache so the coach's sector screening and
# /api/universe-quotes read from cache instead of a cold Yahoo fan-out.
#
# WHY GITHUB ACTIONS IS FINE HERE, DESPITE BEING LATE
#
# GitHub's scheduler is best-effort and routinely runs 3-15 minutes behind,
# and */5 schedules in particular get throttled. That would be disqualifying
# if quote freshness gated correctness — but it does not.
#
# apply_trade and _fill_limit_order_core both price from quote_cache with NO
# cached_at_ms check: they require the row to EXIST, not to be fresh. A
# seven-day-old row satisfies them identically to a five-second-old one. So
# lateness costs nothing, and the earlier idea of moving this onto the
# Cloudflare Worker's per-minute cron was solving a problem that isn't there
# (that Worker is also not deployed — see AGENTS.md).
#
# WHY NOT WARM EVERYTHING, OFTEN
#
# All 4,619 symbols every 5 minutes is ~350k Yahoo requests/day from IP ranges
# Yahoo already throttles. Yahoo is the ONLY price source — verified
# 2026-09-14 that DHAN_ACCESS_TOKEN is unset and all 3,655 cached rows are
# source='yahoo' — so getting the range blocked takes down prices for the
# whole app, not just the coach. The tiering is a safety constraint.
#
# Needs: CRON_SECRET repo secret (same value as the Vercel env var).

on:
  schedule:
    # Tier A (~300 symbols: held, pending orders, watchlist, Nifty100) twice
    # an hour during market hours. 03:30-10:30 UTC = 09:00-16:00 IST, Mon-Fri.
    - cron: "5,35 3-10 * * 1-5"
    # Tier B (~1,000 indexed equities) at 09:20 and 15:45 IST — just after the
    # open and just before the close, which is when a screen is most likely to
    # be asked for.
    - cron: "50 3 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to warm (a, b, or c)"
        required: false
        default: "a"

concurrency:
  group: quote-warmer
  cancel-in-progress: false

jobs:
  warm:
    name: Warm quote_cache
    runs-on: ubuntu-latest
    steps:
      - name: Guard — secret must be configured
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set."
            exit 1
          fi

      - name: Pick tier
        id: tier
        run: |
          # Schedule -> tier. Tier B runs on the two daily crons; everything
          # else (including the half-hourly ticks) is tier A.
          case "${{ github.event.schedule }}" in
            "50 3 * * 1-5"|"15 10 * * 1-5") echo "tier=b" >> "$GITHUB_OUTPUT" ;;
            "") echo "tier=${{ github.event.inputs.tier || 'a' }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "tier=a" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Warm
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          # Page rather than assuming one call covers the tier, and follow the
          # handler's nextOffset rather than stepping by the requested limit:
          # the handler stops itself before Vercel's maxDuration and may cover
          # less than `limit`. Stepping by +240 would silently skip the rest.
          offset=0
          total_warmed=0
          total_failed=0
          for page in $(seq 1 15); do
            body=$(curl -sS --max-time 120               -H "Authorization: Bearer $CRON_SECRET"               "https://stocksaathi.co.in/api/admin-warm-quotes?tier=$TIER&offset=$offset&limit=240") || {
                echo "::warning::request failed at offset $offset"; break; }
            echo "  page $page (offset=$offset): $(echo "$body" | head -c 300)"
            # A Vercel timeout returns an HTML page, not JSON. Say so, instead
            # of letting jq die with "Invalid numeric literal ... exit code 5".
            if ! echo "$body" | jq -e . >/dev/null 2>&1; then
              echo "::error::non-JSON response at offset $offset (Vercel FUNCTION_INVOCATION_TIMEOUT?): $(echo "$body" | head -c 200)"
              exit 1
            fi
            # jq, not sed. The first version parsed with a sed pattern that
            # assumed '"ok":true' with no space. Python's json.dumps writes
            # '"ok": true' WITH one, so it always produced an empty string and
            # the workflow failed while the handler was working perfectly.
            # A parser that cannot fail loudly is worse than no parser.
            ok=$(echo "$body" | jq -r '.ok // false')
            if [ "$ok" != "true" ]; then
              echo "::error::warmer returned ok=$ok body=$(echo "$body" | head -c 300)"
              exit 1
            fi
            w=$(echo "$body" | jq -r '.warmed // 0')
            f=$(echo "$body" | jq -r '.failed // 0')
            total_warmed=$(( total_warmed + w ))
            total_failed=$(( total_failed + f ))
            more=$(echo "$body" | jq -r '.more // false')
            [ "$more" = "true" ] || break
            next=$(echo "$body" | jq -r ".nextOffset // $(( offset + 240 ))")
            if [ "$next" -le "$offset" ]; then
              echo "::error::warmer made no progress at offset $offset — it spent its whole budget before the first chunk"
              exit 1
            fi
            offset=$next
            sleep 3
          done
          echo "tier=$TIER warmed=$total_warmed failed=$total_failed"
          # Partial failure is worth surfacing but not worth failing on: one
          # slow batch is normal against a cold cache and the next tick gets it.
          if [ "$total_failed" != "0" ]; then
            echo "::warning::$total_failed symbols failed to warm this run"
          fi
          # A tier that warms nothing at all means the symbol query or the
          # quote path is broken. Failing loudly here is the whole point —
          # the previous generation of this idea was a comment in
          # universe-quotes.py referring to a cron that did not exist.
          if [ "$total_warmed" = "0" ]; then
            echo "::error::warmed 0 symbols — check /api/live-quote and dhan_instruments"
            exit 1
          fi
