name: dip-stats

# Rebuilds js/data/dipStats.js (each stock's real record of falls and
# recoveries, from Yahoo daily closes) and the stock pages that quote it.
#
# WHY: the first version was a one-off run on 2026-10-01. The stock pages say
# "on <date> X closed at ₹Y, Z% below its highest close", the panic-sell pause
# measures today's fall against the stored peak, and the data-quality gate's
# "last close within 14 days" test only means something if it is re-run. A
# stock suspended after a one-off run would keep an indexable page and a
# stale record for ever.
#
# Weekly is enough: the figures are about falls lasting weeks to years. The
# run fetches ~4,300 tickers with no cache (a runner starts empty), about
# 10-20 minutes. Shares the universe-refresh concurrency group so the two
# never push at the same time.

on:
  schedule:
    - cron: "30 4 * * 0"   # Sunday 04:30 UTC (10:00 IST)
  workflow_dispatch: {}

concurrency:
  group: universe-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild dip statistics + stock pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build dip statistics
        run: python3 scripts/build_dip_stats.py

      - name: Sanity gate
        run: |
          python3 - <<'PY'
          import json, sys
          q = json.load(open("scripts/dip-quality.json"))
          ok = q["counts"].get("ok", 0)
          # 1,727 passed on 2026-10-01. A collapse means Yahoo throttled or
          # failed the runner, not that a thousand stocks broke at once.
          if ok < 1200:
              print(f"::error::only {ok} stocks passed the quality gate; refusing to commit")
              sys.exit(1)
          print("quality gate counts:", q["counts"])
          PY

      - name: Regenerate pre-rendered pages
        run: python3 scripts/prerender.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data/dipStats.js scripts/dip-quality.json
          git add -A stocks/ crash-replay/ stocks.html crash-replay.html chat.html news.html \
                     learn-stock-market.html for-students.html app-shell.html 404.html index.html \
                     sitemap.xml robots.txt js/pageTitles.js scripts/prerender-state.json
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          ok=$(python3 -c "import json;print(json.load(open('scripts/dip-quality.json'))['counts']['ok'])")
          git commit -m "chore(data): weekly dip-recovery refresh (${ok} stocks with indexable records)" \
                     -m "Regenerated by .github/workflows/dip-stats.yml."
          git pull --rebase
          git push
