name: universe-refresh

# Regenerates the shipped instrument + mutual-fund universe and commits it.
#
# WHY: js/data/universeFull.json is a build artifact produced by
# scripts/build-universe.mjs and committed to the repo. Nothing regenerated it,
# so it sat frozen at builtAt 2026-05-03 while the app served it as current —
# no listing, delisting or IPO after that date existed in the product. The
# script's own header already says it is meant to run "on the developer's
# machine or in CI"; this wires up the CI half.
#
# Daily. This was weekly on the grounds that the NSE universe changes slowly;
# that reasoning ignored mfFull.json, which carries a NAV per scheme and is
# what the app prices mutual funds from. See the schedule block below.
#
# WORKS ON GITHUB-HOSTED RUNNERS. Measured 2026-09-13, run 34761640980.
#
# An earlier version of this comment claimed the opposite. That claim was an
# extrapolation, never a measurement: Vercel is blocked by NSE (its
# /api/admin-sync-instruments fails its own gate with "sanity_fail: only 0
# equities"), and the conclusion "GitHub runners are datacenter IPs too" was
# inferred from it rather than tested.
#
# It is wrong. A manual dispatch on ubuntu-latest fetched, directly from NSE:
#   nsearchives.nseindia.com EQUITY_L.csv   -> 200, 2,568 equity rows
#   NSE Emerge SME_EQUITY_L.csv             -> 571 rows
#   BSE main-board master                   -> 3,548 rows
#   niftyindices.com index CSVs             -> all 20, 755-symbol industry map
#   NSE ETF list                            -> 350
#   final build                             -> 4,619 rows, sanity gate passed
# 2,568 is the same count Ali's residential connection returns. The runner is
# not throttled or served a stub; it gets the real file.
#
# NSE blocks Vercel specifically. Do not generalise that to other hosts without
# measuring the host.
#
# KNOWN CHURN: NSE serves Emerge SME_EQUITY_L.csv in a varying row order, so
# ~129 of 4,619 rows (all series SM/ST) change array position between runs even
# when no listing changed. The row set is identical; only order moves. Each run
# therefore commits and triggers a production deploy even on a no-op week. That
# is cosmetic — array position feeds search result ordering among micro-caps
# only. Fix by sorting deterministically before serialising if it ever matters.
#
# SANITY GATE: the build fetches from NSE and niftyindices, which rate-limit
# and occasionally return partial data. A truncated universe would silently
# delete tradeable symbols from the app, so the run refuses to commit if the
# row count collapses.

on:
  schedule:
    # DAILY, 02:30 UTC (08:00 IST).
    #
    # This was weekly, inherited from a comment arguing "the NSE universe
    # changes slowly" and "every commit here triggers a production deploy".
    # Both are true of the equity half and neither justifies weekly, because
    # this workflow also rebuilds mfFull.json -- and that file ships a `nav`
    # and `nav_date` for all 14,120 schemes.
    #
    # AMFI publishes NAVs every business day. js/data/universeLoader.js loads
    # mfFull.json straight into the browser, and marketData.js synthMFQuote
    # prices a fund as `inst.nav * 100` from it. So a weekly rebuild meant
    # every mutual fund in the app was priced at a NAV up to 7 days old -- in
    # a product where 13-18 year olds buy and sell them. That is a wrong
    # price, not a stale label.
    #
    # The cost argument does not hold either: the SME row-order churn below
    # means a run commits and deploys EVERY time regardless of cadence, so
    # weekly did not avoid the deploy, it just batched a week of staleness
    # behind it. The build is ~35s.
    #
    # 08:00 IST picks up the previous business day's NAVs, which AMFI posts
    # late evening IST. Weekend and holiday runs re-fetch the same NAVs and
    # are harmless.
    #
    # Note data-sync.yml already refreshes the mf_master TABLE daily, but the
    # front end reads the committed JSON, not the table -- that never covered
    # this.
    - cron: "30 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: universe-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Rebuild universe + MF catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Record current row counts
        id: before
        run: |
          old_eq=$(python3 -c "import json;print(json.load(open('js/data/universeFull.meta.json')).get('rowCount',0))" 2>/dev/null || echo 0)
          old_mf=$(python3 -c "import json;print(json.load(open('js/data/mfFull.meta.json')).get('row_count',0))" 2>/dev/null || echo 0)
          echo "old_eq=$old_eq" >> "$GITHUB_OUTPUT"
          echo "old_mf=$old_mf" >> "$GITHUB_OUTPUT"
          echo "before: equity=$old_eq mf=$old_mf"

      - name: Rebuild equity universe
        run: node scripts/build-universe.mjs

      - name: Rebuild MF universe
        run: node scripts/build-mf-universe.mjs
        continue-on-error: true

      - name: Sanity gate
        env:
          OLD_EQ: ${{ steps.before.outputs.old_eq }}
          OLD_MF: ${{ steps.before.outputs.old_mf }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          def count(path, key):
              try:
                  with open(path) as fh:
                      return int(json.load(fh).get(key, 0))
              except Exception as exc:
                  print(f"could not read {path}: {exc}")
                  return 0

          new_eq = count("js/data/universeFull.meta.json", "rowCount")
          new_mf = count("js/data/mfFull.meta.json", "row_count")
          old_eq = int(os.environ.get("OLD_EQ") or 0)
          old_mf = int(os.environ.get("OLD_MF") or 0)
          print(f"equity {old_eq} -> {new_eq}")
          print(f"mf     {old_mf} -> {new_mf}")

          fail = []
          # Absolute floor: the real NSE universe is ~4,000 rows. Anything near
          # zero means the fetch failed and returned a stub.
          if new_eq < 2000:
              fail.append(f"equity rowCount {new_eq} below absolute floor 2000")
          # Relative floor: a >20% collapse means partial data, not delistings.
          if old_eq and new_eq < old_eq * 0.8:
              fail.append(f"equity rowCount fell {old_eq} -> {new_eq} (>20% drop)")
          if old_mf and new_mf and new_mf < old_mf * 0.8:
              fail.append(f"mf row_count fell {old_mf} -> {new_mf} (>20% drop)")

          if fail:
              for f in fail:
                  print(f"::error::{f}")
              print("::error::Refusing to commit. Upstream likely returned partial data.")
              sys.exit(1)
          print("sanity gate passed")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data/universeFull.json js/data/universeFull.meta.json \
                  js/data/universeFull.*.json js/data/universeFull.*.json.br \
                  js/data/mfFull.json js/data/mfFull.meta.json \
                  js/data/mfFull.*.json js/data/mfFull.*.json.br 2>/dev/null || true
          # -A picks up the pruned old content-hashed files the build deletes.
          git add -A js/data/
          if git diff --cached --quiet; then
            echo "universe unchanged — nothing to commit"
            exit 0
          fi
          eq=$(python3 -c "import json;print(json.load(open('js/data/universeFull.meta.json'))['rowCount'])")
          git commit -m "chore(data): weekly universe refresh (${eq} equity rows)" \
                     -m "Regenerated by .github/workflows/universe-refresh.yml. Sanity gate passed."
          git push
          echo "committed and pushed"
