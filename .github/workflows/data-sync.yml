name: data-sync

# Nightly data syncs, moved off Vercel Cron.
#
# WHY THIS EXISTS: vercel.json declared 9 cron entries, including
# /api/keepalive at */4 * * * *. The project is on the Vercel Hobby plan,
# which allows 2 cron jobs at daily granularity. Over one 72h window
# /api/keepalive logged 15 invocations against a schedule implying 1,080, and
# the one admin-sync that did fire returned 401 because CRON_SECRET was unset.
# Net effect: dhan_instruments and mf_master sat at 0 rows and
# fundamentals_cache was never created.
#
# GitHub Actions has no such cron limit, so all scheduling now lives here.
# vercel.json no longer declares any crons — one place to look.
#
# Required GitHub secret:
#   CRON_SECRET  — must match the CRON_SECRET env var in the Vercel project.
#                  Keep it DIFFERENT from ADMIN_TOKEN: the handlers accept
#                  either, and ADMIN_TOKEN also unlocks admin_exec_sql
#                  (arbitrary SQL). There is no reason the sync path should
#                  carry admin-panel powers.

on:
  schedule:
    # 13:15 UTC = 18:45 IST, comfortably after the NSE close (10:00 UTC).
    - cron: "15 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh instrument / fundamentals / MF masters
    runs-on: ubuntu-latest
    steps:
      - name: Guard — secret must be configured
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set. Add it under"
            echo "::error::Settings > Secrets and variables > Actions, matching"
            echo "::error::the CRON_SECRET env var in the Vercel project."
            exit 1
          fi
          echo "CRON_SECRET present (${#CRON_SECRET} chars)"

      - name: Sync NSE instrument master
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/instruments.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://stocksaathi.co.in/api/admin-sync-instruments)
          echo "HTTP $code"; head -c 600 /tmp/instruments.json; echo
          # This endpoint runs on Vercel, and NSE blocks Vercel: it fails its
          # own gate with "sanity_fail: only 0 equities (expected >=1800)".
          # FIXED 2026-09-14. This step warned on every run for months.
          #
          # The handler used to fetch EQUITY_L.csv from nseindia.com while
          # running on Vercel, and NSE blocks Vercel, so it tripped its own
          # sanity gate ("only 0 equities") every time and dhan_instruments
          # sat at 0 rows for its entire life. The old comment here correctly
          # identified the cause and proposed fetching on the runner instead.
          #
          # The simpler fix was already sitting in the repo: universe-refresh.yml
          # ALREADY fetches this data daily on a GitHub runner (which NSE does
          # not block) and commits it to js/data/universeFull.json. The handler
          # now reads that committed artifact out of its own deployment, so no
          # outbound NSE call happens at all and nothing can block it.
          #
          # This is a hard failure again, deliberately: it now has no legitimate
          # reason to fail, and a silent warning is what let it rot for months.
          if [ "$code" != "200" ]; then
            echo "::error::instrument sync failed (HTTP $code)"
            cat /tmp/i.json 2>/dev/null | head -c 500
            exit 1
          fi

      - name: Sync fundamentals (stalest first, capped per night)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # The handler pulls the STALEST symbols from fundamentals_refresh_queue
          # and stops itself on a time budget, so a page covers however many it
          # reached (~30-45 at maxDuration 60). Keep calling until it runs dry
          # or the nightly cap is hit.
          #
          # This replaced a fixed `for offset in 0 500 1000 1500 2000` loop.
          # Each page only got through ~45 symbols, then the loop jumped +500,
          # so the same ~225 symbols were refreshed every night and the other
          # 90% of 4,457 equities (including SBIN, TITAN, WIPRO) never were.
          #
          # CAP: Yahoo is the app's only price source and throttles Vercel IPs.
          # ~1,500/night rotates the whole universe every ~3 nights, which is
          # plenty for fundamentals and keeps upstream load bounded.
          cap=1500
          total=0; ok_total=0; fail_pages=0
          for page in $(seq 1 80); do
            code=$(curl -sS -o /tmp/f.json -w '%{http_code}' --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://stocksaathi.co.in/api/admin-sync-fundamentals?limit=500") || code=000
            echo "page $page -> HTTP $code: $(head -c 300 /tmp/f.json)"
            if [ "$code" != "200" ] || ! jq -e . /tmp/f.json >/dev/null 2>&1; then
              fail_pages=$(( fail_pages + 1 ))
              [ "$fail_pages" -ge 3 ] && { echo "::warning::3 failed pages, stopping"; break; }
              sleep 10; continue
            fi
            n=$(jq -r '.processed // 0' /tmp/f.json)
            s=$(jq -r '.success // 0' /tmp/f.json)
            total=$(( total + n )); ok_total=$(( ok_total + s ))
            [ "$n" -gt 0 ] || break
            [ "$total" -lt "$cap" ] || break
            sleep 3
          done
          echo "fundamentals: processed=$total success=$ok_total failed_pages=$fail_pages"
          # Best-effort (upstream rate-limits), so warn rather than fail and
          # let the MF step still run. But zero success means the chain is
          # broken, not throttled -- that should be loud.
          [ "$fail_pages" = "0" ] || echo "::warning::$fail_pages fundamentals page(s) failed"
          if [ "$ok_total" = "0" ]; then
            echo "::error::fundamentals refreshed 0 symbols"
            exit 1
          fi

      - name: Sync AMFI mutual-fund master
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/mf.json -w '%{http_code}' --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://stocksaathi.co.in/api/admin-sync-mf)
          echo "HTTP $code"; head -c 600 /tmp/mf.json; echo
          [ "$code" = "200" ] || exit 1
